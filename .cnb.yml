# =============================================================================
# redis-docker-build · CNB (cnb.cool) 云原生构建流水线（x86_64 + aarch64 双架构）
#
# 架构策略
# ---------
#   x86_64  -> runner.tags: cnb:arch:amd64       节点，基础镜像 centos:7.6.1810
#   aarch64 -> runner.tags: cnb:arch:arm64:v8   节点（CNB 原生 ARM，非 QEMU），
#                                                基础镜像 arm64v8/centos:7
#
#   同一次 push / tag 会触发「两条并行流水线」，各自编译本架构产物。
#   注意：runner 只能在流水线级别配置（Stage 级别不支持），所以同一套 stages
#   通过 YAML 锚点被两条流水线复用——stages 内容是架构无关的。
#
# 发布策略
# ---------
#   两条流水线各自把「本架构」的 tar.gz 上传到**同一个** Release。
#   因此 ensure-release 必须满足：
#     1) 幂等：已存在则更新标题/描述，不重复创建
#     2) 并发安全：两条流水线可能同时创建，409/422 视为已存在
#   上传阶段只 glob 本流水线 workspace 下的 dist/*.tar.gz，天然互不覆盖。
#
# 分支与版本语义（与 GitHub Actions 一致）
# ---------
#   本仓库按 Redis 主版本拆分为两条独立维护的分支线（两条线构建体系差异较大）：
#     * main 分支 = 8.x 线：Redis 8.10.1，RSALv2/SSPLv1/AGPLv3 三许可，滚动发布 `latest`
#     * 7.x  分支 = 7.x 线：Redis 7.2.16，BSD-3-Clause，滚动发布 `latest-7.x`
#   本文件位于 main 分支，因此这里的语义是：
#     - 主线：main / master push    -> 固定 Release `latest`（滚动更新）
#     - 稳定：git tag vRedis-x.y.z  -> 同名 tag Release（固化）
#
# 构建产物形态（8.x 线重要差异）
# ---------
#   Redis 8.10 起官方重写顶层 Makefile，裸跑 make 会连带编译随包的 bundled modules
#   （RediSearch/Query Engine、vector-sets 等），需要 LLVM 21 + Rust 1.94 +
#   CMake 3.25~3.31.6，在 glibc 2.17 编译环境不可行。
#   因此 8.x 线固定「仅编译核心」（build-redis.sh 内自动使用 `make build redis`），
#   产物为完整核心（KV / 持久化 / 主从 / Cluster / Sentinel / TLS / 脚本）。
# =============================================================================

# ── 构建环境锚点（按架构各一份；runner 只能写在流水线级别） ────────────────
# 注意：buildArgs 必须是 docker.build 的子节点（写成 docker 的子节点会被静默忽略，
#       导致异架构仍拉取 Dockerfile 里的默认镜像而报
#       "no match for platform in manifest"）。
.build-env-amd64: &build-env-amd64
  runner:
    tags: cnb:arch:amd64
    cpus: 8
  docker:
    build:
      dockerfile: Dockerfile   # CentOS 7.6.1810 + devtoolset-10 编译环境
      by:                      # 缓存 key 文件：依赖变更时重建环境
        - Dockerfile
        - build-redis.sh
      buildArgs:
        BASE_IMAGE: centos:7.6.1810

.build-env-arm64: &build-env-arm64
  runner:
    tags: cnb:arch:arm64:v8
    cpus: 8
  docker:
    build:
      dockerfile: Dockerfile
      by:
        - Dockerfile
        - build-redis.sh
      buildArgs:
        BASE_IMAGE: arm64v8/centos:7

# 默认 Redis 版本（main 分支 = 8.x 线，默认构建当前最新版 8.10.1）
#   注意：8.10.1 为 RSALv2/SSPLv1/AGPLv3 三许可；需要纯 BSD 协议请用 7.x 分支。
.vars: &vars
  REDIS_VERSION: "8.10.1"

# 稳定版只认 vRedis-* 标签；其余 tag（例如历史遗留的 latest）直接跳过
.is-version-tag: &is-version-tag |
  case "${CNB_BRANCH:-${CI_COMMIT_TAG:-}}" in
    vRedis-*) exit 0 ;;
    *) echo ">>> 非版本 tag，跳过: ${CNB_BRANCH:-${CI_COMMIT_TAG:-}}"; exit 1 ;;
  esac

# ── 统一阶段（两架构 + 主线/稳定版 共用） ──────────────────────────────────
# 场景判定放在第一个 stage，通过 exports 把结果注入后续 stage 的环境变量。
.stages: &stages
  # 判定本次是「主线」还是「稳定版」，并解析版本号
  - name: resolve-scene
    script: |
      set -e
      REF="${CNB_BRANCH:-${CI_COMMIT_TAG:-}}"
      case "$REF" in
        vRedis-*)
          V="${REF#vRedis-}"
          TAG="$REF"
          TITLE="Stable Redis ${V}"
          MK="false"
          echo ">>> 场景: 稳定版构建（tag=${REF}，版本=${V}）"
          ;;
        *)
          V="${REDIS_VERSION:-8.10.1}"
          TAG="latest"
          TITLE="Mainline 8.x (latest)"
          MK="true"
          echo ">>> 场景: 主线构建（ref=${REF}，版本=${V}）"
          ;;
      esac
      echo "##[set-output TAG=${TAG}]"
      echo "##[set-output TITLE=${TITLE}]"
      echo "##[set-output VERSION=${V}]"
      echo "##[set-output MK=${MK}]"
    exports:
      TAG: RELEASE_TAG
      TITLE: RELEASE_TITLE
      VERSION: RELEASE_VERSION
      MK: RELEASE_MAKE_LATEST

  # 编译（架构由流水线的 BASE_IMAGE 决定）
  - name: build-redis
    script: |
      set -e
      echo ">>> 本流水线架构: $(uname -m)"
      bash /usr/local/bin/build-redis.sh \
        --redis-version "${RELEASE_VERSION}" \
        --malloc auto \
        --smoke yes \
        --output "$PWD/dist"

  - name: list-and-check
    script: |
      set -e
      ls -lhR dist/
      for d in dist/*/; do
        echo "===== $d ====="
        cat "${d}BUILD-INFO.txt" 2>/dev/null | head -n 30 || true
      done

  # 让压缩包「自包含」：把 install.sh 与 assets/ 一并放进产物目录
  - name: bundle-installer
    script: |
      set -e
      for d in dist/*/; do
        [ -d "$d" ] || continue
        install -m 0755 install.sh "${d}install.sh"
        install -m 0644 assets/redis.service "${d}redis.service"
        install -m 0644 assets/redis.conf.example "${d}redis.conf"
        # 项目自身许可证（MIT）；上游 Redis 许可证由 build-redis.sh 生成 LICENSE.redis.txt
        install -m 0644 LICENSE "${d}LICENSE"
      done
      # 防御：dist 由容器内 root 写入，个别版本源码包内文件权限异常（如 Redis 8.10 的
      # redis.conf 为 0600）。若打包者非 root，tar 会 Permission denied；统一放开读权限
      # （a+rX 不会给二进制额外加执行位）。CNB 阶段本身是 root，此处属一致性防御。
      chmod -R a+rX dist/
      ls -lh dist/*/

  - name: package
    script: |
      set -e
      cd dist
      for d in */; do tar czf "${d%/}.tar.gz" "${d%/}"; done
      ls -lh *.tar.gz

  # 生成 Release 说明（两条架构流水线内容一致，谁后写都不影响结果）
  - name: gen-notes
    script: |
      set -e
      printf '## %s\n\nRedis Open Source %s **core-only**, built in a Docker-simulated CentOS 7 (glibc 2.17) environment.\n\n| Arch | Asset | Runs on |\n|------|-------|---------|\n| x86_64 | `redis-%s-x86_64.tar.gz` | CentOS 7.6 / 7.9 and later |\n| aarch64 | `redis-%s-aarch64.tar.gz` | aarch64 with glibc >= 2.17 (incl. Kylin V10 SP3) |\n\nEach tarball is self-contained: extract it and run `sudo ./install.sh` (offline install / in-place update).\nIt ships `install.sh`, `redis.conf`, `redis.service`, `LICENSE` (this project, MIT) and `LICENSE.redis.txt` (upstream Redis license).\n\n- **Scope: Redis core only** — KV, persistence (RDB/AOF), replication, Cluster, Sentinel, TLS, scripting.\n  Bundled modules (JSON / Search / TimeSeries / probabilistic / vector-sets) require LLVM 21 + Rust 1.94 + CMake 3.25-3.31.6 and cannot be built on a glibc 2.17 toolchain.\n- Toolchain: CentOS 7 vault archive + devtoolset-10 (GCC 10.2)\n- Allocator: jemalloc (aarch64 uses `--with-lg-page=16` for 4K/64K pages)\n\n> Redis 8.x is licensed under RSALv2 / SSPLv1 / AGPLv3 (tri-license, **at your option**).\n> Redis 7.4-7.8 is RSALv2/SSPLv1; Redis 7.2.x and earlier is BSD-3-Clause (see the `7.x` branch).\n' \
        "${RELEASE_TITLE}" "${RELEASE_VERSION}" "${RELEASE_VERSION}" "${RELEASE_VERSION}" > RELEASE_NOTES.md
      cat RELEASE_NOTES.md

  # 幂等 + 并发安全地确保 Release 存在
  - name: ensure-release
    script: |
      set -e
      TAG="${RELEASE_TAG:?缺少 RELEASE_TAG}"
      NAME="${RELEASE_TITLE:-$TAG}"
      MK="${RELEASE_MAKE_LATEST:-false}"
      API="https://api.cnb.cool/${CNB_REPO_SLUG}/-/releases"
      H_AUTH="Authorization: Bearer ${CNB_TOKEN}"
      H_ACC="Accept: application/vnd.cnb.api+json"

      # 从 releases 列表中提取指定 tag 的 release id
      # 注意：CNB API 的 GET/POST/PATCH 都必须带 Accept: application/vnd.cnb.api+json，
      #       只带 Content-Type 会返回 406
      rel_id() {
        curl -s -m 30 -H "$H_AUTH" -H "$H_ACC" "${API}" \
          | tr -d ' \t\n' \
          | grep -oE "\"id\":\"[0-9]+\",\"tag_name\":\"$1\"" \
          | head -n 1 | grep -oE '[0-9]+' || true
      }

      BODY=$(sed ':a;N;$!ba;s/\\/\\\\/g;s/"/\\"/g;s/\n/\\n/g' RELEASE_NOTES.md)

      echo ">>> 确保 Release 存在: ${TAG}（make_latest=${MK}）"
      OK="no"
      for attempt in 1 2 3 4 5; do
        ID="$(rel_id "$TAG")"
        if [ -n "$ID" ]; then
          echo ">>> 已存在（id=${ID}），更新标题与描述"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -m 30 -X PATCH \
            -H "$H_AUTH" -H "Content-Type: application/json" -H "$H_ACC" \
            "${API}/${ID}" \
            -d "{\"name\":\"${NAME}\",\"body\":\"${BODY}\",\"make_latest\":\"${MK}\"}") || HTTP="000"
          echo ">>> PATCH 结果: HTTP ${HTTP}"
          if [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ]; then
            OK="yes"
          else
            echo ">>> 警告：描述更新失败，但附件仍可上传，继续"
            OK="yes"
          fi
          break
        fi

        echo ">>> 不存在，创建（第 ${attempt} 次尝试）"
        HTTP=$(curl -s -o /tmp/rel.json -w "%{http_code}" -m 30 -X POST \
          -H "$H_AUTH" -H "Content-Type: application/json" -H "$H_ACC" \
          "${API}" \
          -d "{\"tag_name\":\"${TAG}\",\"name\":\"${NAME}\",\"body\":\"${BODY}\",\"draft\":false,\"prerelease\":false,\"make_latest\":\"${MK}\",\"target_commitish\":\"${CNB_COMMIT:-main}\"}") || HTTP="000"
        echo ">>> POST 结果: HTTP ${HTTP}"
        case "$HTTP" in
          200|201) OK="yes"; break ;;
          409|422)
            # 另一条架构流水线抢先创建了，视为成功
            echo ">>> 并发创建冲突，视为已存在"
            OK="yes"; break ;;
        esac
        head -c 300 /tmp/rel.json 2>/dev/null || true
        echo
        echo ">>> 第 ${attempt} 次失败，3s 后重试"
        sleep 3
      done
      if [ "$OK" != "yes" ]; then
        echo "!!! Release 创建失败（tag=${TAG}）"
        exit 1
      fi
      echo ">>> Release ${TAG} 就绪"

  # 上传本架构产物（glob 只匹配本 workspace 的 dist，两架构互不覆盖）
  - name: upload-attachments
    image: cnbcool/attachments:latest
    settings:
      tag: ${RELEASE_TAG}
      attachments:
        - "./dist/*.tar.gz"

# ── 主线：main / master 分支 push（两条流水线并行） ─────────────────────────
main:
  push:
    - name: mainline-amd64
      <<: *build-env-amd64
      env:
        <<: *vars
      stages: *stages
    - name: mainline-arm64
      <<: *build-env-arm64
      env:
        <<: *vars
      stages: *stages

master:
  push:
    - name: mainline-amd64
      <<: *build-env-amd64
      env:
        <<: *vars
      stages: *stages
    - name: mainline-arm64
      <<: *build-env-arm64
      env:
        <<: *vars
      stages: *stages

# ── 稳定版：git tag 推送（两条流水线并行） ─────────────────────────────────
# 说明：主线发布走 CNB Release API（make_latest=true），不再创建名为 latest 的
#       git tag，因此不会再产生「latest tag 触发 tag_push」的噪声构建；
#       这里仍保留 if 过滤，只放行 vRedis-*。
$:
  tag_push:
    - name: stable-amd64
      <<: *build-env-amd64
      if: *is-version-tag
      stages: *stages
    - name: stable-arm64
      <<: *build-env-arm64
      if: *is-version-tag
      stages: *stages
